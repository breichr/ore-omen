name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ore
          POSTGRES_PASSWORD: ore
          POSTGRES_DB: ore_omen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      OO_TEST_DATABASE_URL: postgresql+psycopg://ore:ore@localhost:5432/ore_omen_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Duel simulator runs
        run: uv run python ../tools/duel_sim.py --seed 1 -n 200 klassen

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
